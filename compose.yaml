services:
  downloader:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8765}:8000"
    environment:
      DOWNLOAD_ROOT: /downloads
      DATA_ROOT: /data
      DENO_DIR: /tmp/deno
      HOST_DOWNLOAD_ROOT: ${DOWNLOAD_DIR:?Set DOWNLOAD_DIR in .env or run the platform startup script}
    volumes:
      - type: bind
        source: ${DOWNLOAD_DIR:?Set DOWNLOAD_DIR in .env or run the platform startup script}
        target: /downloads
      - state:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  state:
